name: validate

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: Validation scope
        type: choice
        default: all
        options:
          - all
          - managed-apple

jobs:
  check-formatting:
    if: ${{github.event_name != 'workflow_dispatch' || !inputs.job || inputs.job == 'all'}}
    name: Check formatting
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - run: BuildTools/prepare-workspace.sh linux-packages linux
    - run: python3 BuildTools/buildtools.py format-source
    - run: git diff --exit-code
  unit-tests:
    if: ${{github.event_name != 'workflow_dispatch' || !inputs.job || inputs.job == 'all'}}
    name: Run unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - run: BuildTools/prepare-workspace.sh linux-packages linux
    - run: BuildTools/validate.sh unit-tests
  unit-tests-sanitizers:
    if: ${{github.event_name != 'workflow_dispatch' || !inputs.job || inputs.job == 'all'}}
    name: Run unit tests (${{matrix.sanitizer}} sanitizer)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined, thread, memory]
    env:
      ASAN_OPTIONS: detect_leaks=1
      MSAN_OPTIONS: halt_on_error=1:abort_on_error=1:symbolize=1:print_stacktrace=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
    - uses: actions/checkout@v6
    - run: BuildTools/prepare-workspace.sh linux-packages linux
    - run: BuildTools/validate.sh unit-tests-san-${{matrix.sanitizer}}
  code-coverage:
    if: ${{github.event_name != 'workflow_dispatch' || !inputs.job || inputs.job == 'all'}}
    name: Run code coverage
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - run: BuildTools/prepare-workspace.sh linux-packages linux
    - run: BuildTools/validate.sh code-coverage
    - uses: codecov/codecov-action@v4
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        fail_ci_if_error: true
  windows-file-io:
    if: ${{github.event_name != 'workflow_dispatch' || !inputs.job || inputs.job == 'all'}}
    name: Probe native Windows file paths
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Compare file open and directory enumeration with both CRTs
      run: python BuildTools/probe_windows_file_io.py --output Workspace/windows-file-io.json
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: windows-file-io
        path: Workspace/windows-file-io*
        if-no-files-found: error
  windows:
    if: ${{github.event_name != 'workflow_dispatch' || !inputs.job || inputs.job == 'all'}}
    name: Windows validate (${{ matrix.app }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        app:
        - win32-client
        - win64-client
        - win64-server
        - win64-mapper
        - win64-ascompiler
        - win64-baker
    steps:
    - uses: actions/checkout@v6
    - run: BuildTools/validate.cmd ${{matrix.app}}
  ubuntu:
    if: ${{github.event_name != 'workflow_dispatch' || !inputs.job || inputs.job == 'all'}}
    name: Ubuntu validate (${{ matrix.app }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - app: linux-client
          prepare: linux-packages linux
        - app: linux-gcc-client
          prepare: linux-packages linux
        - app: android-arm32-client
          prepare: android-packages android-arm32
        - app: android-arm64-client
          prepare: android-packages android-arm64
        - app: web-client
          prepare: web-packages web
        - app: linux-server
          prepare: linux-packages linux
        - app: linux-gcc-server
          prepare: linux-packages linux
        - app: linux-mapper
          prepare: linux-packages linux
        - app: linux-gcc-mapper
          prepare: linux-packages linux
        - app: linux-ascompiler
          prepare: linux-packages linux
        - app: linux-gcc-ascompiler
          prepare: linux-packages linux
        - app: linux-baker
          prepare: linux-packages linux
        - app: linux-gcc-baker
          prepare: linux-packages linux
    steps:
    - uses: actions/checkout@v6
    - run: BuildTools/prepare-workspace.sh ${{ matrix.prepare }}
    - run: BuildTools/validate.sh ${{matrix.app}}
  macos:
    if: ${{github.event_name != 'workflow_dispatch' || !inputs.job || inputs.job == 'all'}}
    name: macOS validate (${{ matrix.runner }} / ${{ matrix.app }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-26-intel
          app: mac-client
        - runner: macos-26-intel
          app: ios-client
        - runner: macos-26
          app: mac-client
        - runner: macos-26
          app: ios-client
    steps:
    - uses: actions/checkout@v6
    - run: BuildTools/validate.sh ${{matrix.app}}
  managed-apple:
    if: ${{github.event_name == 'workflow_dispatch' && (!inputs.job || inputs.job == 'all' || inputs.job == 'managed-apple')}}
    name: Managed Apple validate (${{ matrix.runner }} / ${{ matrix.app }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: macos-26-intel
          app: managed-mac-client
        - runner: macos-26
          app: managed-mac-client
        - runner: macos-26-intel
          app: managed-ios-simulator-client
        - runner: macos-26
          app: managed-ios-device-client
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Check available build storage
      run: df -h .
    - run: BuildTools/validate.sh ${{matrix.app}}
    - name: Record remaining build storage
      if: always()
      run: df -h .
